l_english:
 dog_milk_search_decision:0 "Seek Wild Dog Milk"
 dog_milk_search_decision_desc:0 "There is a strange tale told in the hills. Several packs of wild dogs are said to be older than anyone in the villages below; those who drink their milk are said to keep their youth as well.\n\nI would usually send the storyteller away. This time, I have written down the directions."
 dog_milk_search_decision_tooltip:0 "Send a party to find the wild dogs in the hills"
 dog_milk_search_decision_confirm:0 "See that they have what they need"
 dog_milk_open_bottle_decision:0 "Drink Wild Dog Milk"
 dog_milk_open_bottle_decision_desc:0 "The bottle brought back from the hills is sitting in my cupboard. There is a paw print in the sealing wax; I see it whenever I reach for something else.\n\nI did not send people all that way just to keep it locked away."
 dog_milk_open_bottle_decision_tooltip:0 "Fetch the bottle of Wild Dog Milk"
 dog_milk_open_bottle_decision_confirm:0 "Bring me the bottle"

 dog_milk.0010.t:0 "From the Hills"
 dog_milk.0010.desc:0 "At last, the search party returns, though only one of them is willing to enter my room. His boots are caked with mud and one sleeve is missing. He clutches a small clay bottle to his chest.\n\n“We followed them to the stream. Then they stopped running.” He puts the bottle down without meeting my eyes. “The one at the front... it told us to wait our turn.”\n\nI unwrap the cloth. A paw has been pressed into the fresh wax sealing the bottle."
 dog_milk.0010.a:0 "Hand it here. I shall try it."
 dog_milk.0010.b:0 "Lock it in the cupboard for now."
 dog_milk.0010.c:0 "Sell it. Someone is bound to pay for it."

 dog_milk.0020.t:0 "Something in the Cup"
 dog_milk.0020.desc:0 "The milk pours slowly into my cup. It looks ordinary enough. I expect a sour smell, but as I lean closer I find that it is still warm.\n\nMy attendant has lit a fire and is waiting for instructions. I raise the cup, about to speak, when barking breaks out beyond the study door. The attendant hurries to shut it, but the sound only grows clearer.\n\nI look down at the cup in my hands."
 dog_milk.0020.a:0 "Well, I must know what it tastes like."
 dog_milk.0020.b:0 "Boil it first. I can wait a little longer."
 dog_milk.0020.c:0 "No. Put it away again."

 dog_milk.0030.t:0 "The Stalled Hourglass"
 dog_milk.0030.desc:0 "I turn the hourglass over, hoping to finish the last few letters before retiring. By the time I have read them all, the lamp has been trimmed once already. The sand is still suspended in the narrow neck.\n\nAt first I suspect damp. I am about to call for someone to take it away when I lift my hand from the table, and the grains fall all at once. I touch the glass again. They stop.\n\nAfter a few more attempts, I notice that the attendant by the door has fallen to their knees."
 dog_milk.0030.a:0 "Get up! Fetch the others; they must see this!"
 dog_milk.0030.b:0 "Leave me be. I must find out how this works."

 dog_milk.0040.t:0 "An Uninvited Guest"
 dog_milk.0040.desc:0 "An old man in a grey robe is sitting beside my table. I did not hear him enter. He opens a book on his lap, its yellowed pages turning of their own accord until they reach my name.\n\n“I am Time, [ROOT.Char.GetTitledFirstNameNoTooltip]. Everyone has their hour. You are no exception.”\n\nI reach for the book, but my sleeve catches the empty milk bottle. The old man recoils so violently that his chair falls over. He watches the bottle roll, one trembling hand stretched out towards it.\n\n“Set it upright... What is it you want?”"
 dog_milk.0040.a:0 "Then strike my name from your book."
 dog_milk.0040.b:0 "How much gold would you give for this bottle?"
 dog_milk.0040.c:0 "I only wish to spend my remaining years in good health."

 dog_milk.0050.t:0 "An Unfinished Epitaph"
 dog_milk.0050.desc:0 "The mason has sent me a draft of my epitaph for approval. It praises my kindness, my courage, and my wisdom. I suspect he could carve the same words beneath almost anyone's name.\n\nThe space for the year of my death is blank. I think back to my bargain with the old man in grey. If I carry on like this, there may never be any need for that stone.\n\nHe did leave me with one instruction: should I change my mind, I need only put the empty bottle outside my door. He would come for it."
 dog_milk.0050.a:0 "Let the mason wait."
 dog_milk.0050.b:0 "Put the bottle outside."

 trait_dog_milk_timeless:0 "Untouched by Age"
 trait_dog_milk_timeless_desc:0 "Humanity fears time, and time fears Wild Dog Milk."
 dog_milk_bottle_modifier:0 "A Bottle of Wild Dog Milk"
 dog_milk_bottle_modifier_desc:0 "This character keeps a bottle of milk brought down from the hills, its seal stamped with a paw print."
 dog_milk_raw_power_modifier:0 "Uncanny Vigor"
 dog_milk_raw_power_modifier_desc:0 "Since drinking Wild Dog Milk, this character has been seen moving heavy furniture without assistance."
 dog_milk_rebellious_stomach_modifier:0 "An Unsettled Stomach"
 dog_milk_rebellious_stomach_modifier_desc:0 "Since drinking that peculiar milk, this character has been excusing themselves rather often, with a pained look on their face."
 dog_milk_warm_belly_modifier:0 "Warm Milk"
 dog_milk_warm_belly_modifier_desc:0 "After a bowl of boiled dog milk, this character has finally enjoyed a restful night's sleep."
 dog_milk_time_rent_modifier:0 "Time's Ransom"
 dog_milk_time_rent_modifier_desc:0 "Nobody has seen who delivers the gold, yet the purses keep appearing on this character's table."
 dog_milk_ten_good_years_modifier:0 "Renewed Vigor"
 dog_milk_ten_good_years_modifier_desc:0 "There is a spring in this character's step again. Even the attendants are struggling to keep up."
 dog_milk_back_on_clock_modifier:0 "Mortal Once More"
 dog_milk_back_on_clock_modifier_desc:0 "This character is making plans for the rest of their life again. The peculiar milk bottle is nowhere to be seen."
