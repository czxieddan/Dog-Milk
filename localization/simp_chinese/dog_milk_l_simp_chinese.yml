l_simp_chinese:
 dog_milk_search_decision:0 "寻找野生狗奶"
 dog_milk_search_decision_desc:0 "山里流传着一个古怪的说法：有几窝野狗活得比村中最年长的老人还久，饮过它们乳汁的人也不见衰老。\n\n以往听见这种传闻，我只会打发讲故事的人离开。可这一次，我记下了进山的路。"
 dog_milk_search_decision_tooltip:0 "派人寻访山中的野狗"
 dog_milk_search_decision_confirm:0 "备好行装，让他们出发"
 dog_milk_open_bottle_decision:0 "饮用野生狗奶"
 dog_milk_open_bottle_decision_desc:0 "那瓶从山里带回的奶就放在我的柜子里。封蜡上印着一枚爪印，我每次取别的东西，都会看见它。\n\n既然已经带回来了，总不能一直藏着。"
 dog_milk_open_bottle_decision_tooltip:0 "取出保存的野生狗奶"
 dog_milk_open_bottle_decision_confirm:0 "把瓶子拿来"

 dog_milk.0010.t:0 "山中来物"
 dog_milk.0010.desc:0 "派去寻奶的人回来了，却只有一个人肯进屋。他的靴子上全是泥，一只袖子被扯得不见了，怀里倒是紧紧护着一只小陶瓶。\n\n“我们追到山涧边上，它们就不跑了。”他把瓶子放在桌上，始终不肯看我的眼睛。“那只领头的……它叫我们排队。”\n\n我解开裹布。瓶口封着新蜡，上面清清楚楚地印着一枚爪印。"
 dog_milk.0010.a:0 "拿来，让我尝尝。"
 dog_milk.0010.b:0 "先锁进柜子里。"
 dog_milk.0010.c:0 "把它卖了，总有人愿意出价。"

 dog_milk.0020.t:0 "异样的奶香"
 dog_milk.0020.desc:0 "奶液沿着瓶口缓缓流进杯中，颜色与寻常的奶没有什么不同。我原以为会闻到一股酸味，凑近时却发现它还是温的。\n\n侍从已经生好了火，只等我吩咐。我端起杯子，正要开口，书房外忽然传来一阵犬吠。侍从慌忙掩上门，声音却更清楚了。\n\n我低头望向手里的杯子。"
 dog_milk.0020.a:0 "我倒要尝尝是什么滋味。"
 dog_milk.0020.b:0 "先煮开。我还没这么心急。"
 dog_milk.0020.c:0 "不，还是收起来吧。"

 dog_milk.0030.t:0 "停滞的沙漏"
 dog_milk.0030.desc:0 "我把沙漏翻了过来，等着读完最后几封信，好结束今日的事务。可等信件读完，灯芯也剪过一回，那些沙粒竟还悬在细颈里。\n\n起初，我以为是沙子受了潮。正要唤人拿走它，我的手刚离开桌面，沙粒便一齐落了下去；伸手再碰，细沙又停住了。\n\n我来回试了几次，门边的侍从已经跪下了。"
 dog_milk.0030.a:0 "别跪着了，去把其他人叫来！"
 dog_milk.0030.b:0 "别打扰我。我得弄清这是怎么回事。"

 dog_milk.0040.t:0 "不速之客"
 dog_milk.0040.desc:0 "一个灰袍老人不知何时坐在了我的桌边。他摊开膝上的册子，泛黄的书页自行翻动，停在写有我名字的那一页。\n\n“我是时间，[ROOT.Char.GetTitledFirstNameNoTooltip]。人人都有自己的时辰，你也不例外。”\n\n我伸手去取那本册子，衣袖却碰倒了桌上的空奶瓶。老人猛地往后一缩，连椅子都带翻了。他盯着滚动的瓶口，伸出的手抖得厉害。\n\n“把它扶起来……你想要什么？”"
 dog_milk.0040.a:0 "那就把我的名字划掉。"
 dog_milk.0040.b:0 "这瓶子，你愿意出多少金子？"
 dog_milk.0040.c:0 "我只求往后的日子好过一些。"

 dog_milk.0050.t:0 "身后之事"
 dog_milk.0050.desc:0 "石匠托人送来了我的墓志草稿，请我过目。上面称我仁慈、勇敢，又夸赞我的智慧。换上别人的名字，大概也能照着用。\n\n我看着空着的卒年，想起了与那灰袍老人的约定。倘若一直这样活下去，这块石头恐怕永远也用不上。\n\n老人临走时倒是留过一句话：若我改了主意，便将空瓶放到门外。他会来取。"
 dog_milk.0050.a:0 "让石匠慢慢等吧。"
 dog_milk.0050.b:0 "把瓶子放到门外。"

 trait_dog_milk_timeless:0 "岁月不侵"
 trait_dog_milk_timeless_desc:0 "人类惧怕时间，而时间惧怕野生狗奶。"
 dog_milk_bottle_modifier:0 "一瓶野生狗奶"
 dog_milk_bottle_modifier_desc:0 "该角色收藏着一瓶从山中寻来的狗奶，封蜡上盖着一枚爪印。"
 dog_milk_raw_power_modifier:0 "异样的活力"
 dog_milk_raw_power_modifier_desc:0 "该角色饮下了野生狗奶，近来常被人看见独自搬动沉重的家具。"
 dog_milk_rebellious_stomach_modifier:0 "腹中翻腾"
 dog_milk_rebellious_stomach_modifier_desc:0 "自从饮下那瓶怪奶，该角色便频频告退，神色也十分难堪。"
 dog_milk_warm_belly_modifier:0 "温热的乳汁"
 dog_milk_warm_belly_modifier_desc:0 "一碗煮过的狗奶下肚，该角色总算睡了个安稳觉。"
 dog_milk_time_rent_modifier:0 "时间的赎金"
 dog_milk_time_rent_modifier_desc:0 "没人见过送金子的人，钱袋却总会按期出现在该角色的桌上。"
 dog_milk_ten_good_years_modifier:0 "重焕生机"
 dog_milk_ten_good_years_modifier_desc:0 "该角色的步履又轻快起来，连侍从也渐渐跟不上了。"
 dog_milk_back_on_clock_modifier:0 "重归尘世"
 dog_milk_back_on_clock_modifier_desc:0 "该角色重新开始安排往后的生活，那只古怪的奶瓶已不见踪影。"
